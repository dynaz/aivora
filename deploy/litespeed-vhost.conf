# NowAI Store — LiteSpeed / OpenLiteSpeed reverse-proxy virtual host (TEMPLATE, placeholders only).
#
# This reverse-proxies the public HTTPS site to the loopback Node service. It does NOT install or
# replace any web server: LiteSpeed already owns 80/443 on this host. On a CyberPanel host the live
# vhost config is typically /usr/local/lsws/conf/vhosts/<DOMAIN>/vhost.conf — do not edit that file
# by hand in place; instead merge the two blocks below into it, keeping a backup, validate, and reload
# gracefully (scripts/deploy.sh and the server baseline notes describe the scoped-change procedure).
#
# Replace __AIVORA_PORT__ with the chosen unused loopback port (must equal PORT in /etc/aivora/aivora.env).
# HTTPS: issue/attach the certificate for the domain through CyberPanel (Let's Encrypt) on the existing
# :443 listener and map the domain to this vhost. Do NOT enable the public virtual host until the
# hostname/origin and HTTPS are verified (deploy is deferred to an explicit checkpoint).
#
# LiteSpeed forwards the original Host header and sets X-Forwarded-For / X-Forwarded-Proto. The app
# only trusts those when AIVORA_TRUST_PROXY=1 AND it is bound to loopback; it derives Secure cookies and
# the allowed Host/Origin from AIVORA_CANONICAL_ORIGIN, never from forwarded headers.

# 1) External proxy app pointing at the loopback Node service.
extprocessor aivora {
  type                    proxy
  address                 127.0.0.1:__AIVORA_PORT__
  maxConns                100
  pcKeepAliveTimeout      60
  initTimeout             60
  retryTimeout            0
  respBuffer              0
}

# 2) Route all requests for this vhost to that app.
context / {
  type                    proxy
  handler                 aivora
  addDefaultCharset       off
}

# Force HTTPS (optional — enable once the certificate is attached):
# rewrite  {
#   enable                1
